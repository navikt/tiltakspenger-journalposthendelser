apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tiltakspenger-journalposthendelser
  namespace: tpts
  labels:
    team: tpts
spec:
  image: {{ image }}
  port: 8080
  replicas:
    min: 2
    max: 4
  resources:
    limits:
      memory: 704Mi
    requests:
      memory: 672Mi
      cpu: 50m
  # Prober følger felles mal, se «Delte konvensjoner» i navikt/tiltakspenger AGENTS.md. Avvik skal begrunnes med kommentar her.
  startup:
    path: /isalive
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 60
    timeout: 3
  liveness:
    path: /isalive
    periodSeconds: 10
    failureThreshold: 3
    timeout: 3
  readiness:
    path: /isready
    periodSeconds: 5
    failureThreshold: 1
    timeout: 3
  prometheus:
    enabled: true
    path: /metrics
  gcp:
    sqlInstances:
      - name: tiltakspenger-journalposthendelser
        type: POSTGRES_17
        tier: db-custom-1-3840
        diskAutoresize: true
        pointInTimeRecovery: true
        flags:
          - name: "cloudsql.enable_pgaudit"
            value: "on"
          - name: "pgaudit.log"
            value: "write,ddl,role"
          - name: "pgaudit.log_parameter"
            value: "on"
          - name: "pgaudit.log_relation"
            value: "on"
        databases:
          - name: journalposthendelser
            envVarPrefix: DB
  kafka:
    pool: nav-prod
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: tiltakspenger-saksbehandling-api
      external:
       - host: saf.prod-fss-pub.nais.io
       - host: oppgave.prod-fss-pub.nais.io
       - host: dokarkiv.prod-fss-pub.nais.io
       - host: pdl-api.prod-fss-pub.nais.io
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
